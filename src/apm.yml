name: dellarte-della-guerra
version: 0.1.0
description: DellarteDellaGuerra agent setup; the harness lives in the dadg-agent submodule, which depends on bannerlord-agent.
targets:
  - claude
  - codex
dependencies:
  apm:
    - ./submodules/dadg-agent
  mcp:
    - name: bannerlord-search-1_2_12
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5000
    - name: bannerlord-search-1_3_15
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5001
    - name: bannerlord-search-1_4_8
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5002
    - name: bannerlord-search-1_4_6
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5003
    - name: bannerlord-game-controller
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:8080/mcp
    - name: jetbrains-debugger
      registry: false
      transport: stdio
      command: python
      args:
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:29202/debugger-mcp/streamable-http
    - name: music-analysis
      registry: false
      transport: stdio
      command: uvx
      args:
        - "-n"
        - --with
        - mcp==1.30.0
        - mcp_local_music_analysis@0.1.0
